name: Keep Supabase Alive

on:
  schedule:
    # 每 3 天執行一次 (UTC 00:00，台灣時間 08:00)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 支援在 GitHub 網頁上點擊手動執行測試

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to Prevent Inactivity Pause
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          echo "Supabase Response Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "Successfully pinged Supabase!"
          else
            echo "Warning: Ping returned status $HTTP_STATUS"
            exit 1
          fi
